<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notice</title>
    <style>
        :root {
            --primary: #0A1E3F;
            --primary-mid: #0D47A1;
            --primary-light: #1565C0;
            --text-main: #1E293B;
            --text-sub: #475569;
            --bg: #F4F7F9;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg);
            margin: 0;
            padding: 14px;
            color: var(--text-main);
            line-height: 1.6;
            display: flex;
            justify-content: center;
        }

        @keyframes gentleSlide {
            from { opacity: 0.88; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .main-card {
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            border: 1px solid #E1E8ED;
            max-width: 520px;
            width: 100%;
            overflow: hidden;
            animation: gentleSlide 0.22s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        /* ROYAL NAVY HEADER WITH NO FIRM NAME PER ICAI COMPLIANCE */
        .brand-header {
            background: linear-gradient(135deg, #0A1E3F 0%, #0D47A1 50%, #1565C0 100%);
            color: #ffffff;
            padding: 24px 20px;
            text-align: center;
        }

        .brand-header h1 {
            margin: 0;
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        .content {
            padding: 22px 20px;
        }

        .notice-card {
            background: #F8FAFC;
            border: 1px solid #E2E8F0;
            border-left: 5px solid #0D47A1;
            border-radius: 14px;
            padding: 16px 18px;
            margin-bottom: 16px;
            box-shadow: 0 4px 12px rgba(13, 71, 161, 0.04);
        }

        .notice-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .notice-title {
            font-size: 14px;
            font-weight: 800;
            color: #0D47A1;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .notice-badge {
            background: #EFF6FF;
            color: #0D47A1;
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
            padding: 3px 8px;
            border-radius: 10px;
            border: 1px solid #BFDBFE;
        }

        .notice-body {
            font-size: 13.5px;
            color: #334155;
            line-height: 1.55;
        }

        .notice-body b {
            color: #0A1E3F;
        }

        .notice-time {
            margin-top: 10px;
            font-size: 11px;
            color: #94A3B8;
            text-align: right;
            font-weight: 600;
        }
    </style>
</head>
<body>

<div class="main-card">
    <div class="brand-header">
        <h1>Important Notice</h1>
    </div>

    <div class="content">
        <div class="notice-card">
            <div class="notice-top">
                <div class="notice-title">
                    🔔 Monthly TDS Deduction
                </div>
                <div class="notice-badge">Active Advisory</div>
            </div>

            <div class="notice-body">
                Kindly calculate your <b>Income Tax</b> and deduct from salary on a <b>monthly basis</b> to prevent end-of-year tax liability.
            </div>

            <div class="notice-time">
                Updated: Today
            </div>
        </div>
    </div>
</div>

</body>
</html>
