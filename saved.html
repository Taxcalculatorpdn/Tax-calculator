<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saved Client Records</title>
    <style>
        :root {
            --primary: #0A1E3F;
            --primary-mid: #0D47A1;
            --primary-light: #1565C0;
            --accent: #16A34A;
            --text-main: #1E293B;
            --text-sub: #64748B;
            --bg: #F4F7F9;
            --card-bg: #FFFFFF;
            --border: #E2E8F0;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg);
            margin: 0;
            padding: 12px;
            color: var(--text-main);
            display: flex;
            justify-content: center;
        }

        @keyframes gentleSlide {
            from { opacity: 0.9; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .container {
            background: var(--card-bg);
            width: 100%;
            max-width: 500px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            border: 1px solid var(--border);
            overflow: hidden;
            animation: gentleSlide 0.22s cubic-bezier(0.16, 1, 0.3, 1) both;
            min-height: 90vh;
            display: flex;
            flex-direction: column;
        }

        /* HEADER */
        .header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-mid) 55%, var(--primary-light) 100%);
            color: #ffffff;
            padding: 18px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 4px 15px rgba(13, 71, 161, 0.15);
        }

        .back-btn {
            background: rgba(255, 255, 255, 0.18);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #ffffff;
            width: 38px;
            height: 38px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.15s ease;
            flex-shrink: 0;
        }

        .back-btn:active {
            transform: scale(0.94);
            background: rgba(255, 255, 255, 0.3);
        }

        .header-title-box h1 {
            margin: 0;
            font-size: 17px;
            font-weight: 800;
            letter-spacing: 0.3px;
        }

        .header-title-box p {
            margin: 2px 0 0 0;
            font-size: 11px;
            color: #B3E5FC;
            font-weight: 500;
        }

        /* CONTENT */
        .content {
            padding: 16px;
            flex: 1;
        }

        /* SEARCH & FILTER BAR */
        .search-box {
            position: relative;
            margin-bottom: 12px;
        }

        .search-box input {
            width: 100%;
            height: 44px;
            background: #F8FAFC;
            border: 1.5px solid var(--border);
            border-radius: 12px;
            padding: 0 14px 0 38px;
            font-size: 13px;
            color: var(--text-main);
            outline: none;
            transition: border-color 0.2s ease;
        }

        .search-box input:focus {
            border-color: var(--primary-light);
            background: #FFFFFF;
        }

        .search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 15px;
            color: var(--text-sub);
            pointer-events: none;
        }

        .action-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            padding: 0 2px;
        }

        .records-chip {
            background: #EBF3FE;
            color: var(--primary-mid);
            font-size: 11px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 20px;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            border: 1px solid #BFDBFE;
        }

        .clear-all-btn {
            background: none;
            border: none;
            color: #EF4444;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 6px;
            transition: background 0.15s;
        }

        .clear-all-btn:hover {
            background: #FEE2E2;
        }

        /* CARD LIST */
        .record-card {
            background: #FFFFFF;
            border: 1px solid #E2E8F0;
            border-radius: 14px;
            padding: 14px;
            margin-bottom: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            position: relative;
        }

        .record-card:active {
            transform: scale(0.99);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 8px;
            gap: 8px;
        }

        .client-name {
            font-size: 15px;
            font-weight: 800;
            color: var(--text-main);
            line-height: 1.3;
        }

        .pan-pill {
            background: #0F172A;
            color: #FFFFFF;
            font-size: 10px;
            font-weight: 800;
            padding: 3px 8px;
            border-radius: 6px;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        .card-meta-row {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 10px;
        }

        .meta-tag {
            font-size: 10.5px;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 6px;
            background: #F1F5F9;
            color: var(--text-sub);
        }

        .meta-tag.regime {
            background: #E0E7FF;
            color: #3730A3;
            font-weight: 700;
        }

        .meta-tag.cycle {
            background: #FEF3C7;
            color: #92400E;
        }

        .client-info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px 10px;
            font-size: 11px;
            color: var(--text-sub);
            margin-bottom: 10px;
            background: #F8FAFC;
            padding: 8px 10px;
            border-radius: 8px;
        }

        .client-info-grid span {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* STATS PILL BOX */
        .stats-strip {
            display: grid;
            grid-template-columns: 1fr 1fr 1.1fr;
            gap: 6px;
            background: #F1F5F9;
            border-radius: 10px;
            padding: 8px;
            margin-bottom: 12px;
            text-align: center;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
        }

        .stat-label {
            font-size: 9.5px;
            color: var(--text-sub);
            font-weight: 600;
            text-transform: uppercase;
        }

        .stat-val {
            font-size: 12px;
            font-weight: 800;
            color: var(--text-main);
            margin-top: 1px;
        }

        .stat-val.tax {
            color: #D32F2F;
        }

        .stat-val.refund {
            color: #16A34A;
        }

        /* CARD FOOTER WITH ACTION BUTTONS */
        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px dashed var(--border);
            padding-top: 10px;
            gap: 8px;
        }

        .save-time {
            font-size: 10px;
            color: #94A3B8;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .card-btns {
            display: flex;
            gap: 8px;
        }

        .btn-load {
            background: var(--primary-mid);
            color: #ffffff;
            border: none;
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            transition: background 0.15s ease;
        }

        .btn-load:active {
            transform: scale(0.96);
            background: var(--primary);
        }

        .btn-del {
            background: #FEE2E2;
            color: #DC2626;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.15s ease;
        }

        .btn-del:active {
            transform: scale(0.92);
            background: #FECACA;
        }

        /* EMPTY STATE */
        .empty-state {
            text-align: center;
            padding: 50px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .empty-icon {
            font-size: 46px;
            margin-bottom: 12px;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.06));
        }

        .empty-state h3 {
            font-size: 16px;
            font-weight: 800;
            color: var(--text-main);
            margin: 0 0 6px 0;
        }

        .empty-state p {
            font-size: 12px;
            color: var(--text-sub);
            max-width: 280px;
            margin: 0 0 20px 0;
            line-height: 1.5;
        }

        .btn-open-calc {
            background: var(--primary-mid);
            color: #FFFFFF;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 700;
            box-shadow: 0 4px 12px rgba(13, 71, 161, 0.2);
            transition: all 0.15s;
        }

        .btn-open-calc:active {
            transform: scale(0.96);
        }

        /* CONFIRMATION MODAL */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(2px);
            z-index: 9999;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-card {
            background: #FFFFFF;
            border-radius: 16px;
            padding: 20px;
            max-width: 320px;
            width: 100%;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.25);
        }

        .modal-card h4 {
            margin: 0 0 8px 0;
            font-size: 16px;
            font-weight: 800;
            color: var(--text-main);
        }

        .modal-card p {
            margin: 0 0 18px 0;
            font-size: 12px;
            color: var(--text-sub);
            line-height: 1.5;
        }

        .modal-btns {
            display: flex;
            gap: 10px;
        }

        .modal-btns button {
            flex: 1;
            height: 38px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            border: none;
        }

        .btn-modal-cancel {
            background: #F1F5F9;
            color: var(--text-main);
        }

        .btn-modal-danger {
            background: #DC2626;
            color: #FFFFFF;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- HEADER -->
    <div class="header">
        <a href="index.html" class="back-btn" title="Back to Calculator">‹</a>
        <div class="header-title-box">
            <h1>Saved Client Records</h1>
            <p>Client Tax Records & Computations</p>
        </div>
    </div>

    <!-- CONTENT -->
    <div class="content">
        <!-- SEARCH BOX -->
        <div class="search-box">
            <span class="search-icon">🔍</span>
            <input type="text" id="searchInput" placeholder="Search by Client Name or PAN..." oninput="filterRecords()">
        </div>

        <!-- ACTION & STATS BAR -->
        <div class="action-bar">
            <div class="records-chip">
                <span>📁</span>
                <span id="recordCount">0 Records Saved</span>
            </div>
            <button type="button" class="clear-all-btn" id="btnClearAll" onclick="confirmClearAll()" style="display:none;">
                Clear All
            </button>
        </div>

        <!-- RECORDS LIST CONTAINER -->
        <div id="recordsList">
            <!-- Dynamically populated -->
        </div>

        <!-- EMPTY STATE -->
        <div class="empty-state" id="emptyState" style="display:none;">
            <div class="empty-icon">📁</div>
            <h3>No Saved Records Yet</h3>
            <p>When you calculate tax in the calculator, tap <b>"Save Details"</b> to store the calculation here on your device.</p>
            <a href="index.html" class="btn-open-calc">Open Tax Calculator ›</a>
        </div>
    </div>
</div>

<!-- CONFIRM DELETE MODAL -->
<div class="modal-overlay" id="confirmModal">
    <div class="modal-card">
        <h4 id="modalTitle">Confirm Action</h4>
        <p id="modalDesc">Are you sure you want to delete this record?</p>
        <div class="modal-btns">
            <button type="button" class="btn-modal-cancel" onclick="closeConfirmModal()">Cancel</button>
            <button type="button" class="btn-modal-danger" id="btnModalConfirm">Delete</button>
        </div>
    </div>
</div>

<script>
var allRecords = [];
var pendingDeleteId = null;
var isClearingAll = false;

function loadRecords() {
    try {
        var raw = localStorage.getItem('akc_saved_computations');
        allRecords = raw ? JSON.parse(raw) : [];
        if (!Array.isArray(allRecords)) allRecords = [];
    } catch(e) {
        allRecords = [];
    }
    renderRecords(allRecords);
}

function renderRecords(records) {
    var listEl = document.getElementById('recordsList');
    var emptyEl = document.getElementById('emptyState');
    var countEl = document.getElementById('recordCount');
    var clearBtn = document.getElementById('btnClearAll');

    countEl.innerText = records.length + (records.length === 1 ? ' Record Saved' : ' Records Saved');
    clearBtn.style.display = records.length > 0 ? 'inline-block' : 'none';

    if (records.length === 0) {
        listEl.innerHTML = '';
        emptyEl.style.display = 'flex';
        return;
    }

    emptyEl.style.display = 'none';
    var html = '';

    records.forEach(function(rec) {
        var isRefund = rec.finalTax && rec.finalTax.toLowerCase().includes('refund');
        var taxClass = isRefund ? 'refund' : 'tax';
        var taxLabel = isRefund ? 'Refund Due' : 'Balance Tax';

        var orgText = rec.org ? rec.org : '-';
        var distText = rec.district ? rec.district : '-';
        var mobText = rec.mob ? rec.mob : '-';
        var dobText = rec.dob ? rec.dob : '-';

        var fyBadge = rec.fy ? 'FY ' + rec.fy : 'FY 2026-27';
        var regimeBadge = rec.regime === 'OLD' ? 'Old Regime' : 'New Regime';
        var cycleBadge = rec.cycle === 'MIN' ? 'Special (Mar-Feb)' : 'Standard (Apr-Mar)';

        var grossSal = rec.sal ? '₹ ' + Math.round(rec.sal).toLocaleString('en-IN') : '₹ 0';
        var netInc = rec.netTaxable ? '₹ ' + Math.round(rec.netTaxable).toLocaleString('en-IN') : '₹ 0';
        var taxVal = rec.balancePayable ? rec.balancePayable : (rec.finalTax || '₹ 0');

        html += 
            '<div class="record-card">' +
                '<div class="card-header">' +
                    '<div class="client-name">' + (rec.name || 'Unnamed Client') + '</div>' +
                    '<div class="pan-pill">' + (rec.pan || 'NO PAN') + '</div>' +
                '</div>' +

                '<div class="card-meta-row">' +
                    '<span class="meta-tag regime">' + fyBadge + ' • ' + regimeBadge + '</span>' +
                    '<span class="meta-tag cycle">' + cycleBadge + '</span>' +
                '</div>' +

                '<div class="client-info-grid">' +
                    '<span>🏢 <b>Org:</b> ' + orgText + '</span>' +
                    '<span>📍 <b>Dist:</b> ' + distText + '</span>' +
                    '<span>📱 <b>Mob:</b> ' + mobText + '</span>' +
                    '<span>🎂 <b>DOB:</b> ' + dobText + '</span>' +
                '</div>' +

                '<div class="stats-strip">' +
                    '<div class="stat-item">' +
                        '<span class="stat-label">Gross Salary</span>' +
                        '<span class="stat-val">' + grossSal + '</span>' +
                    '</div>' +
                    '<div class="stat-item">' +
                        '<span class="stat-label">Net Taxable</span>' +
                        '<span class="stat-val">' + netInc + '</span>' +
                    '</div>' +
                    '<div class="stat-item">' +
                        '<span class="stat-label">' + taxLabel + '</span>' +
                        '<span class="stat-val ' + taxClass + '">' + taxVal + '</span>' +
                    '</div>' +
                '</div>' +

                '<div class="card-footer">' +
                    '<div class="save-time">🕒 ' + (rec.savedAt || 'Recently') + '</div>' +
                    '<div class="card-btns">' +
                        '<button type="button" class="btn-del" onclick="confirmDeleteOne(\'' + rec.id + '\')" title="Delete Record">🗑️</button>' +
                        '<button type="button" class="btn-load" onclick="restoreRecord(\'' + rec.id + '\')">Open in Calculator ›</button>' +
                    '</div>' +
                '</div>' +
            '</div>';
    });

    listEl.innerHTML = html;
}

function filterRecords() {
    var q = (document.getElementById('searchInput').value || '').trim().toLowerCase();
    if (!q) {
        renderRecords(allRecords);
        return;
    }
    var filtered = allRecords.filter(function(r) {
        var nameMatch = (r.name || '').toLowerCase().includes(q);
        var panMatch = (r.pan || '').toLowerCase().includes(q);
        var orgMatch = (r.org || '').toLowerCase().includes(q);
        var distMatch = (r.district || '').toLowerCase().includes(q);
        return nameMatch || panMatch || orgMatch || distMatch;
    });
    renderRecords(filtered);
}

function restoreRecord(id) {
    localStorage.setItem('akc_restore_id', id);
    window.location.href = 'index.html' + window.location.search;
}

function confirmDeleteOne(id) {
    pendingDeleteId = id;
    isClearingAll = false;
    var target = allRecords.find(function(r) { return r.id === id; });
    var clientName = target ? target.name : 'this record';
    document.getElementById('modalTitle').innerText = 'Delete Record?';
    document.getElementById('modalDesc').innerText = 'Are you sure you want to delete calculation details for ' + clientName + '? This action cannot be undone.';
    document.getElementById('btnModalConfirm').innerText = 'Delete';
    document.getElementById('confirmModal').style.display = 'flex';
}

function confirmClearAll() {
    isClearingAll = true;
    pendingDeleteId = null;
    document.getElementById('modalTitle').innerText = 'Clear All Records?';
    document.getElementById('modalDesc').innerText = 'This will permanently remove all ' + allRecords.length + ' saved client records from this device.';
    document.getElementById('btnModalConfirm').innerText = 'Clear All';
    document.getElementById('confirmModal').style.display = 'flex';
}

function closeConfirmModal() {
    document.getElementById('confirmModal').style.display = 'none';
    pendingDeleteId = null;
    isClearingAll = false;
}

document.getElementById('btnModalConfirm').addEventListener('click', function() {
    if (isClearingAll) {
        allRecords = [];
        localStorage.removeItem('akc_saved_computations');
        closeConfirmModal();
        renderRecords(allRecords);
    } else if (pendingDeleteId) {
        allRecords = allRecords.filter(function(r) { return r.id !== pendingDeleteId; });
        localStorage.setItem('akc_saved_computations', JSON.stringify(allRecords));
        closeConfirmModal();
        renderRecords(allRecords);
    }
});

// Load on start
window.addEventListener('DOMContentLoaded', loadRecords);
</script>
</body>
</html>
